# Ruff 宽松基线（2026-10-19 优化改进批 P1-1 落地）：
# 全量默认规则在存量代码上报 309 处（F401/E741/E402 等历史风格），一次性全开
# 会大面积红、逼出机械大改——与"宽松起步、增量收紧"原则相悖。
# 现只启用高置信、零误报的解析级与安全规则；后续按目录逐批启用 F401/E741 并清零。
exclude = [".venv-ci", "build", "dist", "web/lib/echarts.min.js"]
line-length = 120

[lint]
# E9*（语法/IO 错误）+ F63x（断言/比较误用）+ F7x（语法误用）+ F82（未定义名）
# ——全部是"必错"级：任何命中都是真问题，不涉及风格取舍。
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# 测试与脚本常用副作用导入/通配 re-export，暂不收紧
"tests/*" = []
"strategy-iter/scripts/*" = []
