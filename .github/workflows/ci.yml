name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas pyarrow scipy pytest requests
      - name: Run engine regression tests
        run: python -m pytest quant/tests -q
