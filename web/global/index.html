<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>全球总览 · A股看板</title>
<link rel="stylesheet" href="/lib/tokens.css">
<script src="/lib/util.js"></script>
<script src="/lib/theme.js"></script>
<script src="/lib/echarts.min.js"></script>
<script src="/lib/appbar.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-gutter: stable; } /* 固定滚动条槽：页面高度变化时宽度不突变，避免整页看起来"缩放" */
body {
  background: var(--bg-0); color: var(--text-1);
  font-family: var(--sans); font-size: 13px; min-height: 100vh;
  display: flex; flex-direction: column; font-variant-numeric: tabular-nums;
}
/* 顶栏统一样式见 lib/tokens.css（header.appbar） */
select, button {
  background: var(--bg-2); color: var(--text-1); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 5px 10px; font-size: 12px; outline: none; cursor: pointer; white-space: nowrap; flex: none;
  transition: border-color .18s ease, color .18s ease, transform .12s ease;
}
select:hover, button:hover { border-color: var(--line-2); }
button:active { transform: translateY(1px); }
/* ------- 时钟条 ------- */
#clocks {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 10px 10px 0;
}
@media (max-width: 900px) { #clocks { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { #clocks { grid-template-columns: repeat(2, 1fr); } }
.clock-card {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 9px 12px 8px; box-shadow: var(--shadow-card); position: relative; overflow: hidden;
}
.clock-card .city { font-size: 12px; color: var(--text-2); display: flex; align-items: baseline; gap: 6px; }
.clock-card .city .cn { font-family: var(--serif); font-weight: 700; font-size: 13px; color: var(--text-1); }
.clock-card .time { font-family: var(--mono); font-size: 21px; letter-spacing: .5px; margin-top: 2px; }
.clock-card .date { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.clock-card .mkt { position: absolute; right: 10px; top: 9px; font-size: 10px; padding: 2px 7px; border-radius: 9px; border: 1px solid var(--line); color: var(--text-3); }
.clock-card .mkt.open { color: var(--up); border-color: var(--up-line); background: var(--up-soft); }
.clock-card .mkt.lunch { color: var(--flat); border-color: var(--flat-line); background: var(--accent-soft); }
.clock-card .idx { font-size: 11px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ------- 主网格 ------- */
main { flex: 1; display: grid; gap: 10px; padding: 10px;
  grid-template-columns: minmax(0, 1.35fr) minmax(430px, 1.15fr);
  grid-template-rows: minmax(430px, auto) minmax(360px, auto);
  grid-template-areas: "map trend" "radar heat";
}
@media (max-width: 1150px) {
  /* 堆叠布局下雷达/热力是隐式行：不给最小行高，.body(flex:1+绝对定位图表)会塌成 0 高 */
  main { grid-template-columns: 1fr; grid-template-areas: "map" "trend" "radar" "heat"; grid-auto-rows: minmax(420px, auto); }
}
.panel {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-card); display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
.panel > .ph {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap;
}
.panel > .ph h2 { font-family: var(--serif); font-size: 14px; font-weight: 900; letter-spacing: 1px; }
.panel > .ph .note { font-size: 11px; color: var(--text-3); }
.panel > .ph .spacer { flex: 1; margin-left: 0; }
.panel .body { flex: 1; min-height: 0; position: relative; }
#mapPanel { grid-area: map; } #trendPanel { grid-area: trend; }
#radarPanel { grid-area: radar; } #heatPanel { grid-area: heat; }
.chart { position: absolute; inset: 0; }
/* 趋势头部 chips */
#trendStats { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 0; }
#trendRange { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0; flex-wrap: wrap; }
#trendRange .tr-pick { position: relative; display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); font-size: 11px; white-space: nowrap; }
#trendRange .tr-btn { font-family: var(--mono); font-size: 11px; padding: 2px 8px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--text-1); cursor: pointer; min-width: 56px; }
#trendRange .tr-btn:hover { border-color: var(--line-2); }
#trendRange .tr-btn.empty { color: var(--text-3); font-family: var(--sans); }
#trendRange input[type=date] { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
#trNote { margin-left: auto; font-size: 11px; color: var(--text-3); font-family: var(--mono); white-space: nowrap; }
#trNote.warn { color: var(--up); }
.chip { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 2px 9px; color: var(--text-2); background: var(--bg-1); }
.chip b { font-weight: 700; }
.chip .up { color: var(--up); } .chip .down { color: var(--down); }
/* 分段按钮（雷达窗口 / 热力市场切换） */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 3px 10px; font-size: 11px; background: var(--bg-1); color: var(--text-2); }
.seg button.on { background: var(--bg-3); color: var(--up); font-weight: 700; }
/* 轮动雷达：左象限图 + 右当日涨跌榜单 */
#radarBody { display: grid; grid-template-columns: minmax(0,1fr) 224px; height: 100%; }
#heatFoot { display: flex; align-items: center; gap: 10px; row-gap: 5px; padding: 6px 12px; flex-wrap: wrap;
  border-top: 1px solid var(--line); flex: 0 0 auto; }
#heatFoot .spacer { flex: 1; }
#heatCrumbs { display: none; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--text-2);
  flex-wrap: nowrap; min-width: 0; overflow-x: auto; scrollbar-width: none; }
#heatCrumbs::-webkit-scrollbar { display: none; }
#heatCrumbs.show { display: inline-flex; }
#heatCrumbs .hc-chip { border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; background: var(--bg-1); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
#heatCrumbs .hc-chip:hover { color: var(--up); border-color: var(--line-2); }
#heatCrumbs .hc-chip.cur { cursor: default; color: var(--text-1); background: var(--bg-3); font-weight: 700; }
#heatCrumbs .hc-chip.cur:hover { color: var(--text-1); }
#heatCrumbs .hc-sep { color: var(--text-3); }
#heatBar { display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11px; color: var(--text-2); white-space: nowrap; }
#heatBar .hb-neg b { color: var(--down); margin-left: 3px; }
#heatBar .hb-pos b { color: var(--up); margin-right: 3px; }
#heatBar .hb-neg, #heatBar .hb-pos { display: inline-flex; align-items: center; }
#heatBar .hb-bar { flex: 0 0 220px; height: 10px; border-radius: 5px; border: 1px solid var(--line); position: relative;
  background: linear-gradient(to right, var(--down), var(--bg-2) 50%, var(--up)); }
#heatBar .hb-bar::before { content: ''; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--bar-tick); }
#heatBar .hb-bar::after { content: ''; position: absolute; left: 25%; top: 1px; bottom: 1px; width: 1px; background: var(--bar-tick-2);
  box-shadow: 110px 0 0 var(--bar-tick-2); }
.tl-row[data-theme] { cursor: pointer; border-radius: 4px; }
.tl-row[data-theme]:hover { background: var(--bg-2); }
#radarBody .chartwrap { position: relative; min-width: 0; }
#radarList { border-left: 1px solid var(--line); overflow: auto; padding: 6px 10px 8px; font-size: 11px; }
.tl-h { color: var(--text-3); font-size: 10.5px; margin: 8px 0 5px; letter-spacing: .5px; }
.tl-row { display: grid; grid-template-columns: 66px 1fr 54px; align-items: center; gap: 6px; margin: 4px 0; }
.tl-row .nm { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-row .bar { height: 7px; background: var(--bg-3); border-radius: 2px; position: relative; overflow: hidden; }
.tl-row .bar i { position: absolute; left: 0; top: 0; bottom: 0; display: block; opacity: .85; }
.tl-row .pc { text-align: right; font-family: var(--mono); font-size: 11px; }
@media (max-width: 760px) {
  #radarBody { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) auto; }
  #radarList { border-left: none; border-top: 1px solid var(--line); max-height: 190px; }
}
#msgBar { display: none; margin: 0 10px; padding: 8px 12px; border: 1px solid var(--up-line);
  background: var(--up-soft); color: var(--up); border-radius: var(--r-md); font-size: 12px; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 12px; }
footer { padding: 6px 18px 10px; font-size: 11px; color: var(--text-3); display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="appbar">
  <h1><span class="dot">●</span> 全球总览</h1>
  <span class="sub">五城时钟 · 环球指数地图 · 中美轮动雷达 · 市场热力图</span>
  <button id="btnRefresh" title="重新加载页面">刷新</button>
  <button id="btnFetch" title="后台重新抓取全球数据（约4-5分钟）"><span class="b-full">重新抓取</span><span class="b-mini">重抓</span></button>
  <div class="spacer"></div>
  <span id="gpPill" class="fresh-pill warn" title="数据新鲜度"><span class="dot"></span>检查中…</span>
  <div class="navgroup" id="navgroupSlot"></div>
</header>
<div id="msgBar"></div>

<div id="clocks"></div>

<main>
  <section class="panel" id="mapPanel">
    <div class="ph">
      <h2>环球指数地图</h2>
      <span class="note" id="mapNote">国家底色 = 代表性指数最新涨跌幅；圆点可点击看走势</span>
      <div class="spacer"></div>
      <span class="note" id="mapAsOf"></span>
    </div>
    <div class="body"><div class="chart" id="mapChart"><div class="loading">世界地图加载中…</div></div></div>
  </section>

  <section class="panel" id="trendPanel">
    <div class="ph">
      <h2 id="trendTitle">指数走势</h2>
      <div class="spacer"></div>
      <select id="trendCompare" title="叠加对比指数">
        <option value="">不对比</option>
      </select>
    </div>
    <div id="trendStats"></div>
    <div id="trendRange">
      <div class="seg" id="trQuick" title="快捷区间">
        <button data-d="0" class="on">全部</button><button data-d="60">60日</button><button data-d="120">120日</button>
      </div>
      <div class="seg" id="trKind" title="显示形态">
        <button data-k="min">日内</button><button data-k="line" class="on">折线</button><button data-k="k">K线</button>
      </div>
      <span class="tr-pick">从<button type="button" class="tr-btn empty" id="trStartBtn" title="选择起始日期">不限</button><input type="date" id="trStart" tabindex="-1" aria-hidden="true"></span>
      <span class="tr-pick">到<button type="button" class="tr-btn empty" id="trEndBtn" title="选择截止日期">不限</button><input type="date" id="trEnd" tabindex="-1" aria-hidden="true"></span>
      <span id="trNote"></span>
    </div>
    <div class="body" style="min-height:260px"><div class="chart" id="trendChart"></div></div>
  </section>

  <section class="panel" id="radarPanel">
    <div class="ph">
      <h2>轮动雷达 <span style="font-family:var(--mono);font-weight:400;font-size:11px;color:var(--text-3)">ROTATION RADAR · RS × MOM · 4W TRAIL</span></h2>
      <span class="note">X 相对强度 · Y 动量（20日）· 轨迹=近4周 · 红涨绿跌；方块=A股 菱形=美股</span>
      <div class="spacer"></div>
      <div class="seg" id="radarMkt">
        <button data-m="all" class="on">全部</button><button data-m="us">美股</button><button data-m="cn">中国主题</button>
      </div>
    </div>
    <div class="body" id="radarBody">
      <div class="chartwrap"><div class="chart" id="radarChart"></div></div>
      <div id="radarList"></div>
    </div>
  </section>

  <section class="panel" id="heatPanel">
    <div class="ph">
      <h2>市场热力图</h2>
      <span class="note">矩形大小 = 市值 / 成交额，颜色 = <span id="heatWinNote">当日</span>涨跌幅（缺失显灰）· 点击任意块放大其板块</span>
      <div class="spacer"></div>
      <span class="note" id="heatAsOf"></span>
    </div>
    <div class="body"><div class="chart" id="heatChart"></div></div>
    <div id="heatFoot">
      <div class="seg" id="heatSeg">
        <button data-m="us">美股巨头</button><button data-m="cn" class="on">A股行业</button>
      </div>
      <div class="seg" id="heatWinSeg" title="颜色周期">
        <button data-w="0" class="on">当日</button><button data-w="5">5日</button><button data-w="20">20日</button>
      </div>
      <div id="heatCrumbs"></div>
      <div class="spacer"></div>
      <div id="heatBar"><span class="hb-neg" id="hbNeg"></span><i class="hb-bar"></i><span class="hb-pos" id="hbPos"></span></div>
    </div>
  </section>
</main>

<footer>
  <span>数据源：新浪/同花顺(hithink)，每日收盘后抓取，非实时</span>
  <span id="footErr"></span>
  <span>本页面仅为信息呈现，不构成投资建议</span>
</footer>

<script src="/global/app.js"></script>
</body>
</html>
