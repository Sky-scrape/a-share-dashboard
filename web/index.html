<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>日内轮动 · A股看板</title>
<link rel="stylesheet" href="/lib/tokens.css">
<script src="/lib/util.js"></script>
<script src="/lib/theme.js"></script>
<script src="/lib/echarts.min.js"></script>
<script src="/lib/freshness.js"></script>
<script src="/lib/datepicker.js"></script>
<script src="/lib/appbar.js"></script>
<script>
/* 中文日期 fmtCn 已收敛 /lib/util.js（AK.dates.fmtCn，五页单一来源，2026-09-10） */
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 13px;
  /* 定高视口：仪表盘整页不随内容拉长，网格行高(fr)才有确定基准；
     窄屏堆叠/最小行高溢出时由 main 内部滚动兜底 */
  height: 100vh;
  display: flex; flex-direction: column;
  font-variant-numeric: tabular-nums;
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 顶栏统一样式见 lib/tokens.css（header.appbar）；本页仅补充两行变体：标题行 + 回放控制行 */
header.appbar.appbar-stack { padding: 10px 18px 9px; }
header.appbar.appbar-stack .appbar-row { overflow: hidden; }
/* 滚动条贯通整页右侧（2026-09-23）：滚动从 main 上移到 view 层，溢出时滚动条
   从窗口顶贯到底部；头部两行与隔夜外围条吸顶常驻。行高(fr)基准不变。 */
#viewRotation { overflow-y: auto; scrollbar-gutter: stable; }
#viewRotation > header.appbar.appbar-stack { position: sticky; top: 0; z-index: 30; }
#overnightBar { position: sticky; top: var(--head-h, 92px); z-index: 25; }
header .hdr-player {
  display: flex; flex-direction: column; gap: 7px;
}
header .player-row1 { display: flex; align-items: center; gap: 10px; }
header .player-row2 { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
@media (max-width: 640px) {
  header.appbar.appbar-stack { padding: 8px 12px 7px; }
  select, button { padding: 4px 7px; font-size: 11px; }
}
@media (max-width: 760px) {
  /* 中等窄屏也允许顶栏换行，避免控件被 overflow:hidden 裁掉（旧 bug：481-760px 区间裁剪） */
  header.appbar.appbar-stack .appbar-row { flex-wrap: wrap; overflow: visible; }
}
@media (max-width: 480px) {
  header.appbar.appbar-stack .appbar-row { flex-wrap: wrap; overflow: visible; }
  select, button { padding: 4px 6px; }
  header .navgroup { gap: 5px; }
  header.appbar button.navtab { font-size: 10px; padding: 3px 4px; }
}
.spacer { flex: 1; }
select, button {
  background: var(--bg-2);
  color: var(--text-1); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 5px 10px; font-size: 12px; outline: none; cursor: pointer;
  white-space: nowrap; flex: none;
  transition: border-color .18s ease, color .18s ease, transform .12s ease;
}
select:hover, button:hover { border-color: var(--line-2); color: var(--text-1); }
button:active { transform: translateY(1px); }
.badge {
  font-size: 11px; padding: 3px 9px; border-radius: 11px;
  border: 1px solid var(--line); color: var(--text-3);
}
.badge.ok { color: var(--down); border-color: var(--down-line); background: var(--down-soft); }
.badge.demo { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
main {
  flex: 1; min-height: 0; display: grid; overflow: visible;
  /* 滚动已上移到 #viewRotation 层（2026-09-23）：滚动条贯通整页右侧；
     main 仍是行高(fr)的确定基准——flex:1 定高，溢出内容溢出到 view 滚动 */
  grid-template-columns: minmax(300px, 34%) 1fr;
  /* 行轨道用 fr（min 兜底）而非 auto：行高只按视口分配，不被内容擑开；
     榜单「全部」等长列表在 .ranklist 内部滚动（.panel 已 min-height:0） */
  grid-template-rows: minmax(420px, 1.3fr) minmax(300px, 1fr) minmax(280px, 0.9fr);
  grid-template-areas:
    "heat  heat"
    "rank  curve"
    "watch signal";
  gap: 10px; padding: 10px;
}
.panel {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  display: flex; flex-direction: column;
  min-height: 0;
  transition: border-color .2s ease;
  min-width: 0; /* 允许在窄格内收缩 */
}
.panel:hover { border-color: var(--line-2); }
#heatPanel { grid-area: heat; }
#rankPanel { grid-area: rank; }
#curvePanel { grid-area: curve; }
#watchPanel { grid-area: watch; }
#signalPanel { grid-area: signal; }
#matrixPanel { grid-area: matrix; display: none; }
#matrixPanel .head { flex-wrap: wrap; }   /* 研究面板控件较多，窄屏允许换行 */
#matrixChart { position: absolute; inset: 0; }

/* —— 布局预设：综合 / 复盘 / 盯盘 / 研究 —— */
main[data-layout="review"] {
  grid-template-rows: minmax(380px, 1.2fr) minmax(280px, 1fr) minmax(300px, 1fr);
  grid-template-areas:
    "heat  heat"
    "rank  curve"
    "matrix matrix";
}
main[data-layout="review"] #watchPanel,
main[data-layout="review"] #signalPanel { display: none; }
main[data-layout="review"] #matrixPanel { display: flex; }

main[data-layout="watch"] {
  grid-template-columns: minmax(260px, 30%) 1fr;
  grid-template-rows: minmax(420px, 1fr) minmax(280px, 0.8fr);
  grid-template-areas:
    "rank  heat"
    "watch heat";
}
main[data-layout="watch"] #curvePanel,
main[data-layout="watch"] #signalPanel,
main[data-layout="watch"] #matrixPanel { display: none; }

main[data-layout="research"] {
  grid-template-rows: minmax(340px, 1fr) minmax(300px, 1fr);
  grid-template-areas:
    "matrix matrix"
    "curve signal";
}
main[data-layout="research"] #heatPanel,
main[data-layout="research"] #rankPanel,
main[data-layout="research"] #watchPanel { display: none; }
main[data-layout="research"] #matrixPanel { display: flex; }
.panel .head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 12px; color: var(--text-3);
}
.panel .head b { color: var(--text-1); font-size: 12px; letter-spacing: .04em; }
.panel .body { flex: 1; min-height: 80px; position: relative; overflow: hidden; }
#heatmap { position: absolute; inset: 0; }
#curves { position: absolute; inset: 0; }
header .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; flex: none; }
header .time {
  font-size: 16px; font-weight: 800;
  font-family: Bahnschrift, "Segoe UI", Consolas, monospace;
  min-width: 84px; color: var(--accent);
  letter-spacing: .5px;
}
header .player-row1 input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); height: 4px; }
header .stat { color: var(--text-3); font-size: 12px; cursor: default; white-space: nowrap; }

.ranklist {
  flex: 1; min-height: 120px; overflow-y: auto; padding: 6px 10px;
  display: flex; flex-direction: column; gap: 3px;
}


.rankrow {
  display: flex; align-items: center; gap: 8px;
  padding: 3px 6px; border-radius: var(--r-sm);
  cursor: pointer; font-size: 12px;
  transition: background .15s ease;
}
.rankrow:hover { background: var(--bg-3); }
.rankrow .rno { width: 22px; color: var(--text-3); text-align: right; font-family: Bahnschrift, "Segoe UI", Consolas, monospace; }
.rankrow .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rankrow .pc {
  font-family: Bahnschrift, "Segoe UI", Consolas, monospace;
  width: 64px; text-align: right; font-weight: 700;
}
.up { color: var(--red2); }
.down { color: var(--green2); }
.rankrow.active { background: var(--accent-soft); outline: 1px solid var(--accent-line); }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tabs button.active { border-color: var(--accent); color: var(--accent); }
.legend { font-size: 11px; color: var(--text-3); display: flex; gap: 10px; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
/* 滚动条样式已收敛到 lib/tokens.css 全站单一来源（2026-09-23），本页不再自带副本 */
@media (max-width: 720px) {
  header .sub { display: none; }
  header .player-row2 #speedStat { display: none; }
  header .player-row2 #boardStat { display: none; }
  /* 窄屏忽略布局预设：全部面板纵向堆叠 */
  main, main[data-layout] { display: flex !important; flex-direction: column; }
  /* 手机端（2026-09-03）：回放控制行允许换行；布局预设按钮在窄屏无效（上面已强制纵堆），隐藏省空间，
     避免 btnSummary/预设组把页面撑出横向滚动 */
  header .player-row1 { flex-wrap: wrap; row-gap: 6px; }
  header .player-row1 .tabs { display: none; }  main .panel { display: flex !important; min-height: 280px; }
  /* 热力图/曲线面板加高：堆叠后图表太小会挤成一团 */
  #heatPanel, #curvePanel { min-height: 330px; }
  #matrixPanel { min-height: 360px; }
  /* 移动端榜单密度：行距/列宽收紧，涨跌幅列变窄不挤压名称 */
  .ranklist { padding: 4px 6px; gap: 2px; }
  .rankrow { gap: 6px; font-size: 11px; padding: 3px 4px; }
  .rankrow .rno { width: 18px; }
  .rankrow .pc { width: 52px; }
  /* 钻取面板：底部抽屉式（居中浮层在手机上会超出屏幕），带安全区适配 */
  #drillPanel {
    top: auto !important; bottom: 0 !important; left: 0 !important;
    transform: none !important;
    width: 100vw !important;
    max-height: 78vh;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  #drillPanel table { font-size: 11px !important; }
}
/* 钻取面板表格：斑马纹 + 可点行悬停（对齐全站表格规范，2026-09-08） */
#drillBody tr:nth-child(even) td { background: var(--row-alt); }
#drillBody tr[data-code]:hover td { background: var(--hover-row); }
#viewRecap {
  flex: 1 1 auto; display: none; min-height: 0;
  background: var(--bg-0);
}
</style>
</head>
<body>
<div id="viewRecap" class="view" style="display:none">
  <iframe id="recapFrame" src="/recap" style="display:block;border:0;background:var(--bg-1);width:100%;height:100vh"></iframe>
</div>
<div id="viewRotation" class="view">
<header class="appbar appbar-stack">
  <div class="appbar-row">
    <h1><span class="dot">●</span> 日内轮动</h1>
    <span class="sub">板块热力 · 日内回放 · 自选盯盘</span>
    <span id="dateSel"></span>
    <button id="btnRefresh" title="重新加载当前页面">刷新</button>
    <button id="btnFetch" title="重新抓取当日板块分钟数据"><span class="b-full">重新抓取</span><span class="b-mini">重抓</span></button>
    <div class="spacer"></div>
    <span id="freshPillSlot" class="fresh-pill ok" title="加载中…"><span class="dot"></span>检查中…</span>
    <div class="navgroup" id="navgroupHost"></div>
  </div>
  <div class="hdr-player">
    <div class="player-row1">
      <span class="time" id="clock">09:30</span>
      <input type="range" id="timeline" min="0" max="240" value="0">
      <button id="btnPlay">▶ 播放</button>
      <span class="tabs" style="margin-left:12px" title="面板布局预设（记忆在上次选择）">
        <button class="tabbtn laybtn active" data-lay="all">综合</button>
        <button class="tabbtn laybtn" data-lay="review">复盘</button>
        <button class="tabbtn laybtn" data-lay="watch">盯盘</button>
        <button class="tabbtn laybtn" data-lay="research">研究</button>
      </span>
      <button id="btnSummary" title="生成今日轮动摘要（Markdown，自动复制+下载）">导出小结</button>
    </div>
    <div class="player-row2">
      <span id="modeBadge" class="badge">加载中…</span>
      <button id="btnReset">⟲ 回到开盘</button>
      <button id="btnLive" style="display:none">⏩ 回到实时</button>
      <button id="btnNotify" title="板块放量异动时系统通知（需授权）">🔔 告警关</button>
      <span id="notifyHint" style="display:none;font-size:11px;color:var(--text-2);background:var(--up-soft);border:1px solid var(--up-line);border-radius:5px;padding:2px 8px">首次使用？点这里可开启盘中告警：放量异动 / 尾盘拉升 / 排名突变会弹系统通知</span>
      <span class="stat" id="speedStat">帧间隔 700ms</span>
      <select id="playSpeedCtrl" title="播放速度（每帧停留时长）" style="font-size:11px;padding:3px 6px">
        <option value="1000">慢 · 1秒/分钟</option>
        <option value="700" selected>常 · 0.7秒/分钟</option>
        <option value="450">快 · 0.45秒/分钟</option>
        <option value="250">超快 · 0.25秒/分钟</option>
      </select>
      <span class="stat" id="boardStat"></span>
      <span class="stat" id="alertStat" style="display:none;color:var(--up)"></span>
      <button id="btnCompare" title="双日对比：叠加另一交易日分时对比轮动差异">对比</button>
      <span id="cmpDate" style="display:none"></span>
      <button id="btnExitCompare" style="display:none" title="退出双日对比">退出对比</button>
    </div>
  </div>
</header>

<div id="alertPanel" style="display:none;padding:10px 18px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2)">
  <label style="display:inline-flex;align-items:center;gap:6px;margin-right:16px"><input type="checkbox" id="cfgEnabled"> 启用提醒</label>
  <label style="margin-right:16px">自选涨跌≥ <input type="number" id="cfgWatchPct" style="width:58px;background:var(--bg-3);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 6px"> %</label>
  <label style="margin-right:16px;display:inline-flex;align-items:center;gap:6px"><input type="checkbox" id="cfgWatchZt"> 自选涨停提醒</label>
  <label style="margin-right:16px">板块涨跌≥ <input type="number" id="cfgBoardPct" style="width:58px;background:var(--bg-3);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 6px"> %</label>
  <label style="margin-right:16px">放量≥ <input type="number" id="cfgBoardVol" style="width:58px;background:var(--bg-3);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 6px"> 倍</label>
  <label style="margin-right:16px">排名突变≥ <input type="number" id="cfgRankJump" style="width:58px;background:var(--bg-3);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 6px"> 位</label>
  <label style="margin-right:16px">尾盘拉升≥ <input type="number" id="cfgLastPct" style="width:58px;background:var(--bg-3);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 6px"> %</label>
  <button id="cfgSave" style="padding:3px 12px">保存</button>
  <button id="cfgClose" style="padding:3px 12px">关闭</button>
</div>
<div id="overnightBar" style="display:none;padding:6px 18px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:12px;color:var(--text-2)"></div>
<main>
  <div id="heatPanel" class="panel">
    <div class="head"><b>板块热力图</b><span class="sub" id="heatSubNote">面积/排序=涨跌幅（领涨最大居前），颜色=涨跌幅（红涨绿跌）</span>
      <span class="tabs" style="margin-left:auto" title="面积口径切换">
        <button class="tabbtn areabtn active" data-a="pct">面积=涨跌幅</button>
        <button class="tabbtn areabtn" data-a="amt">面积=成交额</button>
      </span>
    </div>
    <div class="body"><div id="heatmap"></div></div>
  </div>

  <div id="rankPanel" class="panel">
    <div class="head">
      <b>当前时刻榜单</b><span id="curTimeLabel" class="sub">--:--</span>
      <span class="tabs">
        <button data-n="8" class="tabbtn active">Top8</button>
        <button data-n="15" class="tabbtn">Top15</button>
        <button data-n="0" class="tabbtn">全部</button>
      </span>
    </div>
    <div class="ranklist" id="rankList"></div>
  </div>

  <div id="watchPanel" class="panel">
    <div class="head">
      <b>自选股</b><span class="sub">同花顺实时 · 点击行设成本</span>
      <select id="watchFilter" style="font-size:12px;padding:4px 6px;margin-left:auto">
        <option value="all">全部</option>
        <option value="hold">持仓</option>
        <option value="watch">观察</option>
      </select>
      <button id="watchSort" title="按涨幅排序" style="padding:4px 8px">⇅</button>
      <span class="tabs" style="margin-left:0">
        <input id="watchInput" placeholder="代码 600519" style="width:96px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;outline:none">
        <button id="watchAdd">＋</button>
      </span>
    </div>
    <div class="ranklist" id="watchList"><span class="sub" style="padding:8px">输入代码添加自选</span></div>
  </div>



  <div id="curvePanel" class="panel">
    <div class="head">
      <b>涨跌幅曲线</b><span class="sub">点击轮动图板块：钻取个股并高亮曲线；榜单行点击切换高亮</span>
      <span class="legend" style="margin-left:auto">
        <span><i style="background:var(--accent)"></i>当前时刻</span>
        <span>红=涨 绿=跌（A股习惯）</span>
      </span>
    </div>
    <div class="body"><div id="curves"></div></div>
  </div>

  <div id="signalPanel" class="panel">
    <div class="head">
      <b>今日信号</b><span class="sub">尾盘走强 / 持续上升 / 放量异动</span>
      <button class="tabbtn" id="btnVp" style="margin-left:auto" title="切换到量价视图（分时成交额热力 + 放量拉升识别）">量价视图</button>
    </div>
    <div class="ranklist" id="signalList"></div>
    <div class="ranklist" id="vpList" style="display:none;max-height:220px;overflow-y:auto"></div>
  </div>

  <div id="matrixPanel" class="panel">
    <div class="head">
      <b>研究 · 分时沉淀</b>
      <span class="tabs">
        <button class="tabbtn mxbtn active" data-mx="matrix">强度矩阵</button>
        <button class="tabbtn mxbtn" data-mx="patterns">日内形态</button>
        <button class="tabbtn mxbtn" data-mx="race">多日轮动动画</button>
      </span>
      <span id="raceCtrls" style="display:none;align-items:center;gap:6px;margin-left:8px">
        <button class="tabbtn" id="racePlay" title="播放/停止多日轮动动画">▶ 播放</button>
        <span class="tabs" style="margin-left:0" title="动画回看窗口">
          <button class="tabbtn racewin" data-w="5">近5日</button>
          <button class="tabbtn racewin active" data-w="10">近10日</button>
          <button class="tabbtn racewin" data-w="20">近20日</button>
          <button class="tabbtn racewin" data-w="0">全部</button>
        </span>
      </span>
      <span class="sub" id="mxSub" style="margin-left:auto"></span>
    </div>
    <div class="body"><div id="matrixChart"></div></div>
  </div>
</main>

<div id="drillMask" style="display:none;position:fixed;inset:0;background:var(--scrim);z-index:300" title="点击空白处关闭"></div>
<div id="drillPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(680px,92vw);max-height:82vh;overflow-y:auto;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);z-index:301;padding:16px 18px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <b style="font-size:15px" id="drillTitle"></b>
    <span class="sub" id="drillSub"></span>
    <span style="flex:1"></span>
    <button id="drillClose" title="关闭（Esc）">关闭</button>
  </div>
  <div id="drillBody"></div>
</div>
</div>

<script src="/app.js"></script>
</body>
</html>
